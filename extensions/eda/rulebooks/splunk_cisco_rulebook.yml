---

# example_rulebook.yaml
- name: Cisco Splunk rulebook
  hosts: localhost
  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 11000
  rules:
    - name: Match Cisco log event
      condition: event.payload is defined
      actions:
        - print_event:
            pretty: true
