- name: Restart Cisco Interface
  hosts: "{{ host_name }}"
  gather_facts: false
  vars:
    ansible_connection: network_cli
    ansible_network_os: cisco.ios.ios
    ansible_command_timeout: 300
  tasks:
    - name: Restart Interface 
      cisco.ios.ios_interfaces:
        config:
          - name: "{{ interface_name }}"
            enabled: true

