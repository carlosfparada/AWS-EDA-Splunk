---

- name: Get nodes from Inventory and add to Groups
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
  - include_role: 
      name: utils_hosts_aws


- name: Setup RHEL Splunk
  hosts: splunk
  become: true
  tasks:
    - debug:
        var: inventory_hostname

    # - name: Attach Red Hat subscription
    #   community.general.redhat_subscription:
    #     state: present
    #     username: "{{ subscription_user }}"
    #     password: "{{ subscription_pass }}"
    #     pool_ids: "{{ rh_subs_pool_id }}"
    #   become: true

    - name: Download Splunk RPM
      ansible.builtin.get_url:
        url: "https://download.splunk.com/products/splunk/releases/10.6.1.1/linux/splunk-10.6.1.1-b2ae2962645c.x86_64.rpm"
        dest: /tmp/splunk.rpm
        
    - name: Install Splunk RPM
      ansible.builtin.dnf:
        name: /tmp/splunk.rpm
        disable_gpg_check: true
        state: present

    - name: Seed admin credentials (first start only)
      ansible.builtin.copy:
        dest: /opt/splunk/etc/system/local/user-seed.conf
        content: |
          [user_info]
          USERNAME = admin
          PASSWORD = {{ ansible_password }}
        owner: splunk
        group: splunk
        mode: "0600"
        force: false
      no_log: true

    - name: Turn on SSL for Splunk Web
      community.general.ini_file:
        path: /opt/splunk/etc/system/local/web.conf
        section: settings
        option: enableSplunkWebSSL
        value: "true"
        owner: splunk
        group: splunk
        mode: "0600"

    # - name: Disable boot-start
    #   ansible.builtin.command: >
    #     /opt/splunk/bin/splunk disable boot-start

    - name: Enable boot-start (accepts license)
      ansible.builtin.command: >
        /opt/splunk/bin/splunk enable boot-start
        -systemd-managed 1 -user splunk -group splunk
        --accept-license --answer-yes --no-prompt
      args:
        creates: /etc/systemd/system/Splunkd.service

    - name: Start Splunk and enable at boot
      ansible.builtin.systemd:
        name: Splunkd
        state: restarted
        enabled: true

 
- name: Send Cisco events from Splunk to Event-Driven Ansible
  hosts: splunk
  become: true
  vars:
    eda_host: 10.0.0.200            # machine running ansible-rulebook
    eda_port: 5000
    cisco_host: 10.0.0.10           # Cisco device IP as Splunk sees it
    match_text: "changed state to down"
    alert_name: "Cisco - Send to EDA"
    app_dir: /opt/splunk/etc/apps/network_alerts
 
    alert_settings:
      search: "index=network sourcetype=cisco:ios host={{ groups['cisco'][0] }} {{ match_text }} | table _time, host, _raw"
      enableSched: "1"
      cron_schedule: "* * * * *"
      dispatch.earliest_time: "-1m@m"
      dispatch.latest_time: "@m"
      counttype: "number of events"
      relation: "greater than"
      quantity: "0"
      alert.digest_mode: "0"        # trigger once per result, not once per search
      actions: webhook
      action.webhook: "1"
      action.webhook.param.url: "http://aap.cparada.com:11000"
 

  tasks:
    - name: Make sure the app directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: splunk
        group: splunk
        mode: "0755"
      loop:
        - "{{ app_dir }}"
        - "{{ app_dir }}/local"
 
    - name: Set Splunk Web to port 443 with SSL
      community.general.ini_file:
        path: /opt/splunk/etc/system/local/web.conf
        section: settings
        option: "{{ item.option }}"
        value: "{{ item.value }}"
        owner: splunk
        group: splunk
        mode: "0644"
      loop:
        - { option: httpport, value: "443" }
        - { option: enableSplunkWebSSL, value: "true" }

    - name: Allow Splunk to send webhooks to EDA
      community.general.ini_file:
        path: /opt/splunk/etc/system/local/alert_actions.conf
        section: webhook
        option: allowlist.eda
        value: "http://{{ eda_host }}:{{ eda_port }}/.*"
        owner: splunk
        group: splunk
        mode: "0644"
 
    - name: Create the alert (filter + webhook to EDA)
      community.general.ini_file:
        path: "{{ app_dir }}/local/savedsearches.conf"
        section: "{{ alert_name }}"
        option: "{{ item.key }}"
        value: "{{ item.value }}"
        owner: splunk
        group: splunk
        mode: "0644"
      loop: "{{ alert_settings | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Restart Splunk
      ansible.builtin.systemd:
        name: Splunkd
        state: restarted


- name: Cisco setup
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:

    # cat private-key.pem | ansible-vault encrypt_string  --stdin-name 'private_key' --output private-key.vault
    - ansible.builtin.include_vars: files/private-key.yml

    - name: Copy private key locally
      ansible.builtin.copy:
        content: "{{ private_key }}"
        dest: /tmp/private-key.pem
        mode: '0600'

    - name: Set Cisco password
      ansible.builtin.expect:
        command: "ssh -o StrictHostKeyChecking=no -o PubkeyAcceptedKeyTypes=+ssh-rsa -o HostKeyAlgorithms=+ssh-rsa -i /tmp/private-key.pem ec2-user@{{ groups['cisco'][0] }}"
        responses:
          # ip-10-0-0-197# configure terminal
          # ip-10-0-0-197(config)# aaa new-model
          # ip-10-0-0-197(config)# aaa authentication login default local enable
          # ip-10-0-0-197(config)# username ec2-user password xxxx
          # ip-10-0-0-197(config)# exit
          # ip-10-0-0-197# exit
          'ip-*':
            - configure terminal
            - aaa new-model
            - aaa authentication login default local enable
            - username {{ ansible_user }} password {{ ansible_password }}
            - hostname Cisco-1
          'Cisco-*':
            - exit
            - exit
            - exit
      no_log: false # hide passwords on logs


- name: Configure Cisco logging to Splunk
  hosts: cisco
  gather_facts: false
  #connection: ansible.netcommon.network_cli
  vars:
    ansible_connection: network_cli
    ansible_network_os: cisco.ios.ios
    ansible_command_timeout: 300
  tasks:
    - name: Send syslog to Splunk
      cisco.ios.ios_config:
        lines:
          - service timestamps log datetime msec localtime show-timezone
          - logging source-interface Loopback0
          - "logging host {{ groups['cisco'][0] }} transport udp port 1514"
          - logging trap informational
        save_when: modified

