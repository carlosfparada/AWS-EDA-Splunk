---

- name: Get nodes from Inventory and add to Groups
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
  - include_role: 
      name: utils_hosts_aws


- name: Setup RHEL Splunk
  hosts: splunk
  become: true
  tasks:
    - debug:
        var: inventory_hostname

    # - name: Attach Red Hat subscription
    #   community.general.redhat_subscription:
    #     state: present
    #     username: "{{ subscription_user }}"
    #     password: "{{ subscription_pass }}"
    #     pool_ids: "{{ rh_subs_pool_id }}"
    #   become: true

    - name: Download Splunk RPM
      ansible.builtin.get_url:
        url: "https://download.splunk.com/products/splunk/releases/10.6.1.1/linux/splunk-10.6.1.1-b2ae2962645c.x86_64.rpm"
        dest: /tmp/splunk.rpm
        
    - name: Install Splunk RPM
      ansible.builtin.dnf:
        name: /tmp/splunk.rpm
        disable_gpg_check: true
        state: present

    - name: Seed admin credentials (first start only)
      ansible.builtin.copy:
        dest: /opt/splunk/etc/system/local/user-seed.conf
        content: |
          [user_info]
          USERNAME = admin
          PASSWORD = {{ ansible_password }}
        owner: splunk
        group: splunk
        mode: "0600"
        force: false
      no_log: true

    - name: Turn on SSL for Splunk Web
      community.general.ini_file:
        path: /opt/splunk/etc/system/local/web.conf
        section: settings
        option: enableSplunkWebSSL
        value: "true"
        owner: splunk
        group: splunk
        mode: "0600"

    # - name: Disable boot-start
    #   ansible.builtin.command: >
    #     /opt/splunk/bin/splunk disable boot-start

    - name: Enable boot-start (accepts license)
      ansible.builtin.command: >
        /opt/splunk/bin/splunk enable boot-start
        -systemd-managed 1 -user splunk -group splunk
        --accept-license --answer-yes --no-prompt
      args:
        creates: /etc/systemd/system/Splunkd.service

    - name: Start Splunk and enable at boot
      ansible.builtin.systemd:
        name: Splunkd
        state: restarted
        enabled: true

 
- name: Send Cisco events from Splunk to Event-Driven Ansible
  hosts: splunk
  become: true
  tasks:
    - name: Make sure the app directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: splunk
        group: splunk
        mode: "0755"
      loop:
        - "/opt/splunk/etc/apps/network_alerts"
        - "/opt/splunk/etc/apps/network_alerts/local"

    - name: Create app.conf for the custom app
      ansible.builtin.copy:
        dest: "/opt/splunk/etc/apps/network_alerts/local/app.conf"
        owner: splunk
        group: splunk
        mode: "0644"
        content: |
          [ui]
          is_visible = 1
          label = Network Alerts

          [launcher]
          author = Ansible
          description = Cisco syslog inputs and EDA webhook alerts
          version = 1.0.0

    - name: Allow Splunk to send webhooks to EDA
      community.general.ini_file:
        path: /opt/splunk/etc/system/local/alert_actions.conf
        section: webhook
        option: allowlist.eda
        value: "http://{{ aap_fqdn }}:{{ aap_eda_port }}/.*"
        owner: splunk
        group: splunk
        mode: "0644"

    - name: Create props.conf to force current server time on incoming logs
      ansible.builtin.copy:
        dest: "/opt/splunk/etc/apps/network_alerts/local/props.conf"
        owner: splunk
        group: splunk
        mode: "0644"
        # content: |
        #   [cisco:ios]
        #   SHOULD_LINEMERGE = false
        #   LINE_BREAKER = ([\r\n]+)
        content: |
          [cisco:ios]
          SHOULD_LINEMERGE = false
          LINE_BREAKER = ([\r\n]+)
          DATETIME_CONFIG = NONE
          MAX_TIMESTAMP_LOOKAHEAD = 0
            
    - name: Create the alert in savedsearches.conf
      vars:
        alert_settings:
          # Use _index_earliest=-2m the router timestamp and only consider splunk arrival time
          search: "index=network sourcetype=cisco:ios host={{ hostvars[groups['cisco'][0]].private_ip_address }} {{ match_text }} | table _time, host, _raw"

          # Working
          # search: "index=network _index_earliest=-2m _index_latest=now sourcetype=cisco:ios host={{ hostvars[groups['cisco'][0]].private_ip_address }} {{ match_text }} | table _time, host, _raw"
          enableSched: "1"                    # Ativa o agendamento
          is_scheduled: "1"                   # Força o Splunk a registar como Alerta
          cron_schedule: "* * * * *"          # Executa a cada minuto
          dispatch.earliest_time: "-2m"
          dispatch.latest_time: "now"

          is_rt: "1"
          realtime_schedule: "1"


          # Real-Time Cron Mode Configuration
          #   enableSched: "0"                   # Disable periodic cron runs
          #   is_rt: "1"                         # Tell Splunk this is a continuous real-time search
          #   is_scheduled: "1"                  # Forces Splunk to register this as an Alert, NOT a Report
          #   dispatch.earliest_time: "rt-1m"    # Continuous 1-minute lookback window
          #   dispatch.latest_time: "rt"         # Real-time streaming edge     

          # ongoing
          # enableSched: "1"                    # Ativa o agendamento
          # is_rt: "1"
          # is_scheduled: "0"                   # Força o Splunk a registar como Alerta
          # #realtime_schedule: "1"
          # #cron_schedule: "* * * * *"          # Executa a cada minuto
          # dispatch.earliest_time: "rt-1m"
          # dispatch.latest_time: "rt"
          
          # Trigger Conditions
          alert_type: "number of events"
          counttype: "number of events"
          relation: "greater than"
          quantity: "0"
          alert.digest_mode: "0"              # Dispara 1 webhook individual por cada linha de log
          alert.suppress: "0"
          # Webhook Action
          actions: "webhook"
          action.webhook: "1"
          action.webhook.param.url: "http://{{ aap_fqdn }}:{{ aap_eda_port }}"
        # alert_settings:
        #   # SPL Query (Remove _index_earliest so real-time memory streaming works)
        #   search: "index=network sourcetype=cisco:ios host={{ hostvars[groups['cisco'][0]].private_ip_address }} {{ match_text }} | table _time, host, _raw"
        #   # Real-Time Mode Configuration
        #   enableSched: "0"                   # Disable periodic cron runs
        #   is_rt: "1"                         # Tell Splunk this is a continuous real-time search
        #   is_scheduled: "1"                  # Forces Splunk to register this as an Alert, NOT a Report
        #   dispatch.earliest_time: "rt-1m"    # Continuous 1-minute lookback window
        #   dispatch.latest_time: "rt"         # Real-time streaming edge          
        #   # Trigger Conditions
        #   counttype: "number of events"
        #   relation: "greater than"
        #   quantity: "0"
        #   alert.digest_mode: "0"             # Send 1 separate webhook POST per event immediately
        #   alert.suppress: "0"
        #   # Webhook Action
        #   actions: "webhook"
        #   action.webhook: "1"
        #   action.webhook.param.url: "http://{{ aap_fqdn }}:{{ aap_eda_port }}"
      community.general.ini_file:
        path: "/opt/splunk/etc/apps/network_alerts/local/savedsearches.conf"
        section: "{{ alert_name }}"
        option: "{{ item.key }}"
        value: "{{ item.value }}"
        owner: splunk
        group: splunk
        mode: "0644"
      loop: "{{ alert_settings | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Make sure the app directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: splunk
        group: splunk
        mode: "0755"
      loop:
        - "/opt/splunk/etc/apps/network_alerts"
        - "/opt/splunk/etc/apps/network_alerts/local"
        - "/opt/splunk/etc/apps/network_alerts/metadata"
    
    - name: Set UI visibility and permissions for savedsearches
      ansible.builtin.copy:
        dest: "/opt/splunk/etc/apps/network_alerts/metadata/local.meta"
        owner: splunk
        group: splunk
        mode: "0644"
        content: |
          [savedsearches/{{ alert_name }}]
          access = : [ * ], write : [ admin ]
          export = system
            
    - name: Create the index
      ansible.builtin.copy:
        dest: "/opt/splunk/etc/apps/network_alerts/local/indexes.conf"
        owner: splunk
        group: splunk
        mode: "0644"
        content: |
          [network]
          homePath = $SPLUNK_DB/network/db
          coldPath = $SPLUNK_DB/network/colddb
          thawedPath = $SPLUNK_DB/network/thaweddb

    - name: Create the UDP syslog input
      ansible.builtin.copy:
        dest: "/opt/splunk/etc/apps/network_alerts/local/inputs.conf"
        owner: splunk
        group: splunk
        mode: "0644"
        content: |
          [udp://1514]
          sourcetype = cisco:ios
          index = network
          connection_host = ip

    - name: Restart Splunk
      ansible.builtin.systemd:
        name: Splunkd
        state: restarted


- name: Cisco setup
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - ansible.builtin.include_vars: files/private-key.yml

    - name: Copy private key locally
      ansible.builtin.copy:
        content: "{{ private_key }}"
        dest: /tmp/private-key.pem
        mode: '0600'

    - name: Set Cisco password
      ansible.builtin.expect:
        command: "ssh -o StrictHostKeyChecking=no -o PubkeyAcceptedKeyTypes=+ssh-rsa -o HostKeyAlgorithms=+ssh-rsa -i /tmp/private-key.pem ec2-user@{{ groups['cisco'][0] }}"
        responses:
          # ip-10-0-0-197# configure terminal
          # ip-10-0-0-197(config)# aaa new-model
          # ip-10-0-0-197(config)# aaa authentication login default local enable
          # ip-10-0-0-197(config)# username ec2-user password xxxx
          # ip-10-0-0-197(config)# exit
          # ip-10-0-0-197# exit
          'ip-*':
            - configure terminal
            - aaa new-model
            - aaa authentication login default local enable
            - username {{ ansible_user }} password {{ ansible_password }}
            - hostname Cisco-1
          'Cisco-*':
            - exit
            - exit
            - exit
      no_log: false # hide passwords on logs


- name: Configure Cisco logging to Splunk
  hosts: cisco
  gather_facts: false
  #connection: ansible.netcommon.network_cli
  vars:
    ansible_connection: network_cli
    ansible_network_os: cisco.ios.ios
    ansible_command_timeout: 300
  tasks:
    - name: Send syslog to Splunk
      cisco.ios.ios_config:
        lines:
          - service timestamps log datetime msec localtime show-timezone
          - logging source-interface GigabitEthernet 1
          - "logging host {{ groups['splunk'][0] }} transport udp port 1514"
          - logging trap informational
        save_when: modified


