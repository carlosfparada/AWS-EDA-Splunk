---

- name: Get nodes from Inventory and add to Groups
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
  - include_role: 
      name: utils_hosts_aws


- name: Setup RHEL Splunk
  hosts: splunk
  become: true
  gather_facts: no
  tasks:
    # - name: Attach Red Hat subscription
    #   community.general.redhat_subscription:
    #     state: present
    #     username: "{{ subscription_user }}"
    #     password: "{{ subscription_pass }}"
    #     pool_ids: "{{ rh_subs_pool_id }}"
    #   become: true

    - name: Download Splunk RPM
      ansible.builtin.get_url:
        url: "{{ splunk_download_url }}"
        dest: /tmp/splunk.rpm
        
    - name: Install Splunk RPM
      ansible.builtin.dnf:
        name: /tmp/splunk.rpm
        disable_gpg_check: true
        state: present

    - name: Seed admin credentials (first start only)
      ansible.builtin.copy:
        dest: /opt/splunk/etc/system/local/user-seed.conf
        content: |
          [user_info]
          USERNAME = admin
          PASSWORD = {{ ansible_password }}
        owner: splunk
        group: splunk
        mode: "0600"
        force: false
      no_log: true

    - name: Turn on SSL for Splunk Web
      community.general.ini_file:
        path: /opt/splunk/etc/system/local/web.conf
        section: settings
        option: enableSplunkWebSSL
        value: "true"
        owner: splunk
        group: splunk
        mode: "0600"

    # - name: Disable boot-start
    #   ansible.builtin.command: >
    #     /opt/splunk/bin/splunk disable boot-start

    - name: Enable boot-start (accepts license)
      ansible.builtin.command: >
        /opt/splunk/bin/splunk enable boot-start
        -systemd-managed 1 -user splunk -group splunk
        --accept-license --answer-yes --no-prompt
      args:
        creates: /etc/systemd/system/Splunkd.service

    # - name: Start Splunk and enable at boot
    #   ansible.builtin.systemd:
    #     name: Splunkd
    #     state: restarted
    #     enabled: true

 
# - name: Send Cisco events from Splunk to Event-Driven Ansible
#   hosts: splunk
#   become: true
#   tasks:
    - name: Make sure the app directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: splunk
        group: splunk
        mode: "0755"
      loop:
        - "/opt/splunk/etc/apps/network_alerts"
        - "/opt/splunk/etc/apps/network_alerts/local"
        - "/opt/splunk/etc/apps/network_alerts/metadata"

    - name: Create app.conf for the custom app
      ansible.builtin.copy:
        dest: "/opt/splunk/etc/apps/network_alerts/local/app.conf"
        owner: splunk
        group: splunk
        mode: "0644"
        content: |
          [ui]
          is_visible = 1
          label = Network Alerts

          [launcher]
          author = Ansible
          description = Cisco syslog inputs and EDA webhook alerts
          version = 1.0.0

    - name: Allow Splunk to send webhooks to EDA
      community.general.ini_file:
        path: /opt/splunk/etc/system/local/alert_actions.conf
        section: webhook
        option: allowlist.eda
        value: "http://{{ aap_fqdn }}:{{ aap_eda_port }}/.*"
        owner: splunk
        group: splunk
        mode: "0644"

    - name: Create props.conf to force current server time on incoming logs
      ansible.builtin.copy:
        dest: "/opt/splunk/etc/apps/network_alerts/local/props.conf"
        owner: splunk
        group: splunk
        mode: "0644"
        content: |
          [cisco:ios]
          SHOULD_LINEMERGE = false
          LINE_BREAKER = ([\r\n]+)
          DATETIME_CONFIG = NONE
          MAX_TIMESTAMP_LOOKAHEAD = 0
            
      # search for alerts sent
      #index=_internal sourcetype=splunkd component=sendmodalert | table _time, savedsearch_name, status, action_name, _raw
    - name: Create the alert in savedsearches.conf
      vars:
        alert_settings:
          # Use _index_earliest=-2m the router timestamp and only consider splunk arrival time
          search: "index=network sourcetype=cisco:ios host={{ hostvars[groups['cisco'][0]].private_ip_address }} {{ splunk_match_text }} | table _time, host, _raw"
          # Schedulling 
          enableSched: "1"
          is_scheduled: "1"
          cron_schedule: "* * * * *"
          dispatch.earliest_time: "-2m"
          dispatch.latest_time: "now"
          # Trigger Conditions
          alert_type: "number of events"
          counttype: "number of events"
          relation: "greater than"
          quantity: "0"
          alert.track: "1"
          alert.digest_mode: "0"
          alert.suppress: "0"
          # Webhook Action
          actions: "webhook"
          action.webhook: "1"
          action.webhook.param.url: "http://{{ aap_fqdn }}:{{ aap_eda_port }}"
      community.general.ini_file:
        path: "/opt/splunk/etc/apps/network_alerts/local/savedsearches.conf"
        section: "{{ splunk_alert_name }}"
        option: "{{ item.key }}"
        value: "{{ item.value }}"
        owner: splunk
        group: splunk
        mode: "0644"
      loop: "{{ alert_settings | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
    
    - name: Set UI visibility and permissions for savedsearches
      ansible.builtin.copy:
        dest: "/opt/splunk/etc/apps/network_alerts/metadata/local.meta"
        owner: splunk
        group: splunk
        mode: "0644"
        content: |
          # 1. Establish app-level sharing rules
          []
          access = read : [ * ], write : [ admin ]
          export = system

          # 2. Expose the specific real-time alert object
          [savedsearches/{{ splunk_alert_name | replace(' ', '%20') }}]
          access = read : [ * ], write : [ admin ]
          export = app
          owner = admin
            
    - name: Create the index
      ansible.builtin.copy:
        dest: "/opt/splunk/etc/apps/network_alerts/local/indexes.conf"
        owner: splunk
        group: splunk
        mode: "0644"
        content: |
          [network]
          homePath = $SPLUNK_DB/network/db
          coldPath = $SPLUNK_DB/network/colddb
          thawedPath = $SPLUNK_DB/network/thaweddb

    - name: Create the UDP syslog input
      ansible.builtin.copy:
        dest: "/opt/splunk/etc/apps/network_alerts/local/inputs.conf"
        owner: splunk
        group: splunk
        mode: "0644"
        content: |
          [udp://1514]
          sourcetype = cisco:ios
          index = network
          connection_host = ip




    - name: Configure Splunk Web on Port 443 with SSL
      community.general.ini_file:
        path: /opt/splunk/etc/system/local/web.conf
        section: settings
        option: "{{ item.option }}"
        value: "{{ item.value }}"
        owner: splunk
        group: splunk
        mode: "0600"
      loop:
        - { option: "enableSplunkWebSSL", value: "true" }
        - { option: "httpport", value: "443" }

    - name: Allow Splunk systemd service to bind to privileged ports (<1024)
      ansible.builtin.ini_file:
        path: /etc/systemd/system/Splunkd.service.d/override.conf
        section: Service
        option: CapabilityBoundingSet
        value: CAP_NET_BIND_SERVICE
        owner: root
        group: root
        mode: "0644"

    - name: Grant splunkd binary permission to bind to port 443
      community.general.capabilities:
        path: /opt/splunk/bin/splunkd
        capability: cap_net_bind_service+ep
        state: present

    - name: Configure systemd capability and library override for Splunkd 
      ansible.builtin.copy:
        dest: /etc/systemd/system/Splunkd.service.d/override.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [Service]
          Environment="LD_LIBRARY_PATH=/opt/splunk/lib"
          CapabilityBoundingSet=CAP_NET_BIND_SERVICE
          AmbientCapabilities=CAP_NET_BIND_SERVICE

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true


    - name: Restart Splunk
      ansible.builtin.systemd:
        name: Splunkd
        state: restarted


- name: Cisco setup
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - ansible.builtin.include_vars: files/private-key.yml

    - name: Copy private key locally
      ansible.builtin.copy:
        content: "{{ private_key }}"
        dest: /tmp/private-key.pem
        mode: '0600'

    - name: Set Cisco password
      ansible.builtin.expect:
        command: "ssh -o StrictHostKeyChecking=no -o PubkeyAcceptedKeyTypes=+ssh-rsa -o HostKeyAlgorithms=+ssh-rsa -i /tmp/private-key.pem ec2-user@{{ groups['cisco'][0] }}"
        responses:
          # ip-10-0-0-197# configure terminal
          # ip-10-0-0-197(config)# aaa new-model
          # ip-10-0-0-197(config)# aaa authentication login default local enable
          # ip-10-0-0-197(config)# username ec2-user password xxxx
          # ip-10-0-0-197(config)# exit
          # ip-10-0-0-197# exit
          'ip-*':
            - configure terminal
            - aaa new-model
            - aaa authentication login default local enable
            - username {{ ansible_user }} password {{ ansible_password }}
            - hostname Cisco-1
          'Cisco-*':
            - exit
            - exit
            - exit
      no_log: false # hide passwords on logs


- name: Configure Cisco logging to Splunk
  hosts: cisco
  gather_facts: false
  #connection: ansible.netcommon.network_cli
  vars:
    ansible_connection: network_cli
    ansible_network_os: cisco.ios.ios
    ansible_command_timeout: 300
  tasks:
    - name: Send syslog to Splunk
      cisco.ios.ios_config:
        lines:
          - service timestamps log datetime msec localtime show-timezone
          - logging source-interface GigabitEthernet 1
          - "logging host {{ groups['splunk'][0] }} transport udp port 1514"
          - logging trap informational
        save_when: modified


