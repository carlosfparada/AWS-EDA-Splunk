---

# VPC SPLUNK
ec2_vpc_name: VPC_SPLUNK
ec2_vpc_region: us-east-1
ec2_vpc_cidr: 10.0.0.0/16
# Subnet
ec2_subnet_name: Subnet_SPLUNK
ec2_subnet_cidr: 10.0.0.0/24
ec2_subnet_az: us-east-1a
# Subnet1
ec2_subnet_name1: Subnet_SPLUNK_ENI1
ec2_subnet_cidr1: 10.0.1.0/24
# Subnet2
ec2_subnet_name2: Subnet_SPLUNK_ENI2
ec2_subnet_cidr2: 10.0.2.0/24
# Cisco ENIs
ec2_cisco_eni_name1: ENI_CISCO_SPLUNK1
ec2_cisco_eni_name2: ENI_CISCO_SPLUNK2
# IGW
ec2_igw_name: IGW_SPLUNK
# Route Table
ec2_rt_name: RT_SPLUNK
# RHEL Rules
ec2_sg_name: SG_SPLUNK
ec2_sg_rules:
  - proto: tcp
    ports:
      - 80
      - 443
      - 22
    cidr_ip: 0.0.0.0/0
    rule_desc: Allow all on ports
  - proto: icmp
    icmp_code: -1 # icmp type, -1 = any type
    icmp_type:  -1 # icmp subtype, -1 = any subtype
    cidr_ip: 0.0.0.0/0
    rule_desc: Allow all ICMP

# CISCO
# https://www.cisco.com/c/en/us/td/docs/routers/C8000V/AWS/deploying-c8000v-on-amazon-web-services/deploy-c8000v-on-amazon-web-services.html
# AMI
ec2_cisco_image_name: "Cisco-C8K-PAYG-ESS-17.15.02a-0973be0f-17dc-43c1-9677-13348bbfe587"
ec2_cisco_image_id: ami-070b9ff0a5ff52017
# Volumes
ec2_cisco_volumes:
  - device_name: /dev/xvda
    ebs:
      volume_type: gp2
      volume_size: 16
      delete_on_termination: true
      encrypted: false
# Flavour 
ec2_cisco_flavor_name: t3.medium
# Key Pair
ec2_cisco_key_name: "KeyPair-Virginia"
# Instance
ec2_cisco_instance_name: cisco-1

# ec2-user / ?
ec2_cisco_user: "{{ ansible_user }}"
ec2_cisco_pass: "{{ ansible_password }}"


# SPLUNK - RHEL
# AMI
ec2_splunk_image_name: RHEL-9.5.0_HVM*x86_64*
ec2_splunk_image_id: ami-055f190f5416b8118
# Flavour 
ec2_splunk_flavor_name: t2.large
# Disk
ec2_splunk_disk_size: 20
ec2_splunk_ebs_name: /dev/sda1
# Key Pair
ec2_splunk_key_name: "KeyPair-Virginia"
# Instance
ec2_splunk_instance_name: rhel-1
ec2_splunk_user: "ec2-user"
ec2_splunk_pass: "{{ ansible_password }}"
