######## 
# CMDB #
########


# Cisco (show ip interface brief)
l3_interfaces_cisco:
  - name: GigabitEthernet2
    ipv4:
    - address: 10.12.12.12/24
  - name: VirtualPortGroup0
    ipv4:
    - address: 10.13.13.13/24

# Cisco (sh running-config | section bgp)
bgp:
  as_number: '45000'
  neighbors:
    - neighbor_address: 192.168.1.11
      remote_as: '11000'
    - neighbor_address: 192.168.1.12
      remote_as: '12000'
    - neighbor_address: 192.168.1.13
      remote_as: '13000'
    # - neighbor_address: 192.168.1.14
    #   remote_as: '14000'
  timers:
    keepalive: 1000
    holdtime: 200

# Cisco (show banner login)
banner:
  login: "This is my Login Banner, set by Ansible GitOps v1"

# Cisco (show ip name-server)
dns_servers: 
  - 8.8.8.8
  - 8.8.8.9
  # - 8.8.8.10